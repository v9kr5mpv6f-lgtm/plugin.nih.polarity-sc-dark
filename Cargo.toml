[workspace]
resolver = "2"
members = [
  "plugin",
  "framework/nih_plug",
  "framework/nih_plug_derive",
  "framework/nih_plug_vizia",
  "framework/nih_plug_xtask",
  "framework/cargo_nih_plug",
  "framework/xtask",
]


[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# baseview's macOS view sends `isKeyWindow` to a window that is still nil while the view is being
# attached (`become_first_responder`). Sending a message to nil is harmless in Objective-C and in
# release builds, but a debug build checks the null pointer and aborts the standalone. Turn that
# debug-only check off for baseview in debug builds.
[profile.dev.package.baseview]
debug-assertions = false
